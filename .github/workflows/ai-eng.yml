name: ai-eng
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ^11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Agent Note format gate (docs/testing-policy.md). Add your package's
      # smallest checks (typecheck / tests / coverage) as extra steps here.
      - run: pnpm install
      - run: pnpm exec ai-eng verify-notes .agents/notes
